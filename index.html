<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vote</title>

    <style>
        :root {
            --blue: #1e6bff;
            --red: #e03131;
            --text: #222;
            --muted: #888;
            --line: #ececec;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: white;
            color: var(--text);
            text-align: center;
        }

        #back {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 6px 0;
            font-size: 14px;
            color: var(--muted);
            text-decoration: none;
        }

        #back:hover { color: var(--text); }

        main {
            max-width: 860px;
            margin: 100px auto 40px;
        }

        h1 {
            font-size: 44px;
            font-weight: 600;
            margin: 0 0 10px;
        }

        h1 .for { color: var(--blue); }
        h1 .against { color: var(--red); }

        .subtitle {
            margin: 0 0 48px;
            font-size: 14px;
            color: var(--muted);
        }

        #stations {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        .station {
            padding: 28px 24px;
            border: 1px solid var(--line);
            border-radius: 20px;
        }

        .station h2 {
            margin: 0 0 20px;
            font-size: 26px;
            font-weight: 600;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .buttons button {
            flex: 1;
            max-width: 150px;
            padding: 11px 0;
            font-size: 15px;
            font-weight: 600;
            background: white;
            border-radius: 999px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }

        .for-btn { color: var(--blue); border: 2px solid var(--blue); }
        .against-btn { color: var(--red); border: 2px solid var(--red); }

        .for-btn:hover:not(:disabled) { background: var(--blue); color: white; }
        .against-btn:hover:not(:disabled) { background: var(--red); color: white; }

        .buttons button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .result {
            margin-top: 14px;
            min-height: 22px;
            font-size: 14px;
            color: var(--muted);
        }

        .remove-btn {
            display: none;
            margin: 2px auto 0;
            padding: 4px 8px;
            font-size: 13px;
            color: var(--muted);
            background: none;
            border: none;
            text-decoration: underline;
            cursor: pointer;
        }

        .remove-btn:hover:not(:disabled) { color: var(--text); }
        .remove-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .bar {
            display: flex;
            height: 34px;
            margin-top: 20px;
            padding: 3px;
            background: var(--line);
            border-radius: 999px;
            overflow: hidden;
        }

        .bar-for, .bar-against {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1 1 0;
            min-width: 0;
            font-size: 13px;
            font-weight: 600;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            border-radius: 999px;
            transition: flex-grow 0.5s ease, margin 0.5s ease;
        }

        .bar-for { background: var(--blue); }
        .bar-against { background: var(--red); }

        .total {
            margin-top: 8px;
            font-size: 12px;
            color: var(--muted);
        }

        small {
            display: block;
            margin-top: 36px;
            font-size: 12px;
            color: var(--muted);
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <a href="https://nrgu.org" id="back">← Back</a>

    <main>
        <h1><span class="for">For</span> or <span class="against">Against</span>?</h1>
        <p class="subtitle">Vote for the current elevråd</p>

        <div id="stations"></div>

        <small>
            You get one vote per person. You can remove it at any time and vote again.
        </small>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged }
            from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, onSnapshot, writeBatch, increment }
            from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAIPtFw3b-BMaz6hpZfGOrm3Y_WGIG6d34",
            authDomain: "my-base-6f65f.firebaseapp.com",
            projectId: "my-base-6f65f",
            storageBucket: "my-base-6f65f.firebasestorage.app",
            messagingSenderId: "1032034958108",
            appId: "1:1032034958108:web:baab1635dfb0e41ad758d9",
            measurementId: "G-X9Z61B7GKV"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Add or rename stations here. The id must match the Firestore document name and the rules.
        const CANDIDATES = [
            { id: "hamza", name: "Hamza" },
            { id: "clara", name: "Clara" }
        ];

        const stationsEl = document.getElementById("stations");
        const field = choice => (choice === "for" ? "forVotes" : "againstVotes");

        function createStation({ id, name }) {
            const el = document.createElement("section");
            el.className = "station";
            el.innerHTML = `
                <h2></h2>
                <div class="buttons">
                    <button class="for-btn" disabled>For</button>
                    <button class="against-btn" disabled>Against</button>
                </div>
                <div class="result">Loading...</div>
                <button class="remove-btn">Remove my vote</button>
                <div class="bar">
                    <div class="bar-for">50%</div>
                    <div class="bar-against">50%</div>
                </div>
                <div class="total"></div>
            `;
            el.querySelector("h2").textContent = name;
            stationsEl.appendChild(el);

            const forBtn = el.querySelector(".for-btn");
            const againstBtn = el.querySelector(".against-btn");
            const removeBtn = el.querySelector(".remove-btn");
            const result = el.querySelector(".result");
            const barFor = el.querySelector(".bar-for");
            const barAgainst = el.querySelector(".bar-against");
            const totalEl = el.querySelector(".total");

            const totalsRef = doc(db, "votes", id);
            let uid = null;
            let currentChoice = null;

            const voterRef = () => doc(db, "voters", `${id}_${uid}`);

            function showVoted(choice) {
                currentChoice = choice;
                forBtn.disabled = true;
                againstBtn.disabled = true;
                removeBtn.disabled = false;
                removeBtn.style.display = "block";
                result.textContent = `You voted ${choice === "for" ? "For" : "Against"}.`;
            }

            function showCanVote() {
                currentChoice = null;
                forBtn.disabled = false;
                againstBtn.disabled = false;
                removeBtn.style.display = "none";
                result.textContent = "";
            }

            function updateBar(forVotes, againstVotes) {
                const total = forVotes + againstVotes;
                const forPct = total ? (forVotes / total) * 100 : 50;
                const againstPct = total ? 100 - forPct : 50;

                barFor.style.flexGrow = forPct;
                barAgainst.style.flexGrow = againstPct;
                barAgainst.style.marginLeft = forPct > 0 && againstPct > 0 ? "3px" : "0";

                barFor.textContent = total ? Math.round(forPct) + "%" : "0%";
                barAgainst.textContent = total ? Math.round(againstPct) + "%" : "0%";
                totalEl.textContent = `${total} vote${total === 1 ? "" : "s"}`;
            }

            // Live results for everyone
            onSnapshot(totalsRef, snap => {
                const d = snap.data() || {};
                updateBar(d.forVotes || 0, d.againstVotes || 0);
            }, () => {
                result.textContent = "Couldn't load results.";
            });

            async function vote(choice) {
                if (!uid || currentChoice) return;

                forBtn.disabled = true;
                againstBtn.disabled = true;
                result.textContent = "Submitting...";

                try {
                    const batch = writeBatch(db);
                    batch.set(voterRef(), { choice, at: Date.now() });
                    batch.update(totalsRef, { [field(choice)]: increment(1) });
                    await batch.commit();
                    showVoted(choice);
                } catch (err) {
                    console.error(err);
                    showCanVote();
                    result.textContent = "Vote failed. Please try again.";
                }
            }

            async function removeVote() {
                if (!uid || !currentChoice) return;

                const choice = currentChoice;
                removeBtn.disabled = true;
                result.textContent = "Removing...";

                try {
                    const batch = writeBatch(db);
                    batch.delete(voterRef());
                    batch.update(totalsRef, { [field(choice)]: increment(-1) });
                    await batch.commit();
                    showCanVote();
                } catch (err) {
                    console.error(err);
                    showVoted(choice);
                    result.textContent = "Couldn't remove your vote. Please try again.";
                }
            }

            forBtn.onclick = () => vote("for");
            againstBtn.onclick = () => vote("against");
            removeBtn.onclick = removeVote;

            // Called once we have an anonymous user
            return {
                async init(userId) {
                    uid = userId;
                    try {
                        const snap = await getDoc(voterRef());
                        if (snap.exists()) return showVoted(snap.data().choice);
                    } catch (e) { /* treat as not voted */ }
                    showCanVote();
                },
                fail(msg) { result.textContent = msg; }
            };
        }

        const stations = CANDIDATES.map(createStation);

        onAuthStateChanged(auth, async user => {
            if (!user) {
                try { await signInAnonymously(auth); }
                catch (e) { stations.forEach(s => s.fail("Couldn't connect.")); }
                return;
            }
            stations.forEach(s => s.init(user.uid));
        });
    </script>

</body>
</html>
