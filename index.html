<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vote</title>

    <style>
        :root {
            --blue: #1e6bff;
            --red: #e03131;
            --text: #222;
            --muted: #888;
            --line: #e5e5e5;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: white;
            color: var(--text);
            text-align: center;
        }

        #back {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 6px 0;
            font-size: 14px;
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
        }

        #back:hover { color: var(--text); }

        main {
            max-width: 460px;
            margin: 120px auto 0;
        }

        h1 {
            font-size: 44px;
            font-weight: 600;
            margin: 0 0 10px;
        }

        h1 .for { color: var(--blue); }
        h1 .against { color: var(--red); }

        .subtitle {
            margin: 0 0 36px;
            font-size: 14px;
            color: var(--muted);
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .buttons button {
            flex: 1;
            max-width: 180px;
            padding: 12px 0;
            font-size: 16px;
            font-weight: 600;
            background: white;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }

        #forBtn { color: var(--blue); border: 2px solid var(--blue); }
        #againstBtn { color: var(--red); border: 2px solid var(--red); }

        #forBtn:hover:not(:disabled) { background: var(--blue); color: white; }
        #againstBtn:hover:not(:disabled) { background: var(--red); color: white; }

        .buttons button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        #result {
            margin-top: 16px;
            min-height: 22px;
            font-size: 14px;
            color: var(--muted);
        }

        #bar {
            display: flex;
            height: 36px;
            margin-top: 24px;
            background: var(--line);
            overflow: hidden;
        }

        #barFor, #barAgainst {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50%;
            font-size: 14px;
            font-weight: 600;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            transition: width 0.5s ease;
        }

        #barFor { background: var(--blue); }
        #barAgainst { background: var(--red); }

        #total {
            margin-top: 8px;
            font-size: 12px;
            color: var(--muted);
        }

        small {
            display: block;
            margin-top: 36px;
            font-size: 12px;
            color: var(--muted);
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <button id="back" onclick="goBack()">← Back</button>

    <main>
        <h1><span class="for">For</span> or <span class="against">Against</span>?</h1>
        <p class="subtitle">Vote for the current student council</p>

        <div class="buttons">
            <button id="forBtn" disabled>For</button>
            <button id="againstBtn" disabled>Against</button>
        </div>

        <div id="result">Loading...</div>

        <div id="bar">
            <div id="barFor">50%</div>
            <div id="barAgainst">50%</div>
        </div>
        <div id="total"></div>

        <small>
            You may only vote once, and your choice cannot be changed afterwards.
        </small>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged }
            from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, onSnapshot, writeBatch, increment }
            from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAIPtFw3b-BMaz6hpZfGOrm3Y_WGIG6d34",
            authDomain: "my-base-6f65f.firebaseapp.com",
            projectId: "my-base-6f65f",
            storageBucket: "my-base-6f65f.firebasestorage.app",
            messagingSenderId: "1032034958108",
            appId: "1:1032034958108:web:baab1635dfb0e41ad758d9",
            measurementId: "G-X9Z61B7GKV"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const forBtn = document.getElementById("forBtn");
        const againstBtn = document.getElementById("againstBtn");
        const result = document.getElementById("result");
        const barFor = document.getElementById("barFor");
        const barAgainst = document.getElementById("barAgainst");
        const totalEl = document.getElementById("total");

        const LOCAL_KEY = "hasVoted";
        let uid = null;

        window.goBack = function () {
            window.location.href = "https://gallery.nrgu.org";
        };

        function lockButtons(choice) {
            forBtn.disabled = true;
            againstBtn.disabled = true;
            result.textContent = choice
                ? `You voted ${choice === "for" ? "For" : "Against"}.`
                : "You have already voted.";
        }

        function updateBar(forVotes, againstVotes) {
            const total = forVotes + againstVotes;
            const forPct = total ? (forVotes / total) * 100 : 50;
            const againstPct = total ? 100 - forPct : 50;

            barFor.style.width = forPct + "%";
            barAgainst.style.width = againstPct + "%";
            barFor.textContent = total ? forPct.toFixed(1) + "%" : "0%";
            barAgainst.textContent = total ? againstPct.toFixed(1) + "%" : "0%";
            totalEl.textContent = `${total} vote${total === 1 ? "" : "s"}`;
        }

        // Live results for everyone
        onSnapshot(doc(db, "votes", "totals"), snap => {
            const d = snap.data() || {};
            updateBar(d.forVotes || 0, d.againstVotes || 0);
        }, () => {
            result.textContent = "Couldn't load results.";
        });

        async function vote(choice) {
            if (!uid || localStorage.getItem(LOCAL_KEY)) return;

            forBtn.disabled = true;
            againstBtn.disabled = true;
            result.textContent = "Submitting...";

            try {
                const batch = writeBatch(db);
                batch.set(doc(db, "voters", uid), {
                    choice,
                    at: Date.now()
                });
                batch.update(doc(db, "votes", "totals"), {
                    [choice === "for" ? "forVotes" : "againstVotes"]: increment(1)
                });
                await batch.commit();

                localStorage.setItem(LOCAL_KEY, choice);
                lockButtons(choice);
            } catch (err) {
                console.error(err);
                result.textContent = "Vote failed (you may have already voted).";
            }
        }

        forBtn.onclick = () => vote("for");
        againstBtn.onclick = () => vote("against");

        // Sign in anonymously, then check if this browser already voted
        onAuthStateChanged(auth, async user => {
            if (!user) {
                try { await signInAnonymously(auth); }
                catch (e) { result.textContent = "Couldn't connect."; }
                return;
            }

            uid = user.uid;

            const localVote = localStorage.getItem(LOCAL_KEY);
            if (localVote) return lockButtons(localVote);

            try {
                const snap = await getDoc(doc(db, "voters", uid));
                if (snap.exists()) {
                    localStorage.setItem(LOCAL_KEY, snap.data().choice);
                    return lockButtons(snap.data().choice);
                }
            } catch (e) { /* ignore, treat as not voted */ }

            result.textContent = "";
            forBtn.disabled = false;
            againstBtn.disabled = false;
        });
    </script>

</body>
</html>
